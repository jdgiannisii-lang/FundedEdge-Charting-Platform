name: Lighthouse

on:
  pull_request:
    paths:
      - 'apps/web/src/**'
      - 'apps/web/lighthouserc.js'
      - '.github/workflows/lighthouse.yml'

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm build --filter=@fundededge/web

      - name: Run Lighthouse CI
        run: pnpm exec lhci autorun --config=apps/web/lighthouserc.js
